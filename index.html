  <!-- Dark Header -->
  <header class="bg-slate-900 text-white py-8 px-4 sm:px-6 border-b border-slate-800">
    <div class="max-w-3xl mx-auto">
      <h1 id="header-title" class="text-2xl sm:text-3xl font-bold tracking-tight leading-snug"></h1>
      <p id="header-updated" class="mt-2 text-xs sm:text-sm text-slate-400 font-medium"></p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 space-y-8">

    <!-- 1. Completed Events -->
    <section aria-labelledby="completed-heading" class="bg-white rounded-xl border border-slate-200 p-5 sm:p-6 shadow-sm">
      <div class="flex items-center gap-2.5 mb-4">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
        <h2 id="completed-heading" class="text-lg font-semibold text-slate-900">Completed Events</h2>
      </div>
      <div id="completed-container" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- 2. On going -->
    <section aria-labelledby="ongoing-heading" class="bg-white rounded-xl border border-slate-200 p-5 sm:p-6 shadow-sm">
      <div class="flex items-center gap-2.5 mb-4">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
        <h2 id="ongoing-heading" class="text-lg font-semibold text-slate-900">On going</h2>
      </div>
      <div id="ongoing-container" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- 3. Upcoming Events -->
    <section aria-labelledby="upcoming-heading" class="space-y-4">
      <div class="flex items-center gap-2.5 px-1">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
        <h2 id="upcoming-heading" class="text-lg font-semibold text-slate-900">Upcoming Events</h2>
      </div>
      <div id="upcoming-container" class="space-y-4"></div>
    </section>

    <!-- 4. In Planning Events -->
    <section aria-labelledby="planning-heading" class="bg-white rounded-xl border border-slate-200 p-5 sm:p-6 shadow-sm">
      <div class="flex items-center gap-2.5 mb-4">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
        <h2 id="planning-heading" class="text-lg font-semibold text-slate-900">In Planning Events</h2>
      </div>
      <div id="planning-container" class="flex flex-wrap gap-2"></div>
    </section>

  </main>

  <!-- Rendering Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const data = JSON.parse(document.getElementById("event-data").textContent);

      // Header
      document.getElementById("page-title").textContent = data.title;
      document.getElementById("header-title").textContent = data.title;
      document.getElementById("header-updated").textContent = `Last updated: ${data.lastUpdated}`;

      // Completed Events
      const completedContainer = document.getElementById("completed-container");
      data.completedEvents.forEach(event => {
        const span = document.createElement("span");
        span.className = "px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-sm font-medium";
        span.textContent = event;
        completedContainer.appendChild(span);
      });

      // Ongoing Events
      const ongoingContainer = document.getElementById("ongoing-container");
      data.ongoingEvents.forEach(event => {
        const span = document.createElement("span");
        span.className = "px-3 py-1.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200/70 text-sm font-medium";
        span.textContent = event;
        ongoingContainer.appendChild(span);
      });

      // Upcoming Events
      const upcomingContainer = document.getElementById("upcoming-container");
      data.upcomingEvents.forEach(event => {
        const article = document.createElement("article");
        article.className = "bg-white rounded-xl border border-slate-200 p-5 sm:p-6 shadow-sm";

        let participantsHTML = "";
        if (event.participants && event.participants.length > 0) {
          const participantBadges = event.participants.map(p => 
            `<span class="px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 text-xs sm:text-sm">${p}</span>`
          ).join("");

          participantsHTML = `
            <div class="mt-4 pt-4 border-t border-slate-100">
              <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2.5">
                Participants (${event.participants.length})
              </p>
              <div class="flex flex-wrap gap-1.5">
                ${participantBadges}
              </div>
            </div>
          `;
        }

        article.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 sm:gap-4">
            <h3 class="text-base sm:text-lg font-semibold text-slate-900">${event.name}</h3>
            <span class="text-sm font-medium text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md w-fit">${event.dateTime}</span>
          </div>
          <p class="mt-1.5 text-sm text-slate-600">
            Organizer: <span class="font-medium text-slate-800">${event.organizer}</span>
          </p>
          ${participantsHTML}
        `;
        upcomingContainer.appendChild(article);
      });

      // Planning Events
      const planningContainer = document.getElementById("planning-container");
      data.planningEvents.forEach(event => {
        const span = document.createElement("span");
        span.className = "px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-sm font-medium";
        span.textContent = event;
        planningContainer.appendChild(span);
      });
    });
  </script>

</body>
</html>
