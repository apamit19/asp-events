<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASP Kreedothsav & Kala Taranga November 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Hero Section -->
    <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-xl relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#4f46e5_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10 text-center sm:text-left">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-semibold tracking-wide uppercase mb-3 border border-indigo-500/30">
                <i class="fa-solid fa-calendar-star"></i> Event Schedule
            </div>
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
                ASP Kreedothsav & Kala Taranga November 2026! 🏆
            </h1>
            <div class="mt-3 flex items-center justify-center sm:justify-start gap-2 text-xs sm:text-sm text-indigo-200">
                <i class="fa-regular fa-clock"></i>
                <span>Last Updated: <strong class="text-white font-medium">01-Nov-2026</strong></span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

        <!-- Table Container -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/80 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                            <th class="py-4 px-6 w-5/12">Event</th>
                            <th class="py-4 px-6 w-3/12">Date</th>
                            <th class="py-4 px-6 w-4/12">Organizer(s)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic JavaScript rendering table rows here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-8">
        <div class="max-w-6xl mx-auto px-4">
            <p>© 2026 ASP Events Committee • Designed for smooth event coordination</p>
        </div>
    </footer>

    <!-- JavaScript Data & Rendering -->
    <script>
        const eventsData = [
            {
                name: "Event Kick off",
                date: "01-Nov-2026",
                organizer: "Shruthi",
                icon: "fa-flag-checkered",
                isFinale: false
            },
            {
                name: "Fixtures",
                date: "01-Nov-2026",
                organizer: "Vignesh",
                icon: "fa-sitemap",
                isFinale: false
            },
            {
                name: "Chess and Carrom",
                date: "4th to 13th Nov 2026",
                organizer: "Vignesh",
                icon: "fa-chess",
                isFinale: false
            },
            {
                name: "Treasure Hunt",
                date: "14-Nov-2026, 10am onwards",
                organizer: "Harshith / Sanjay",
                icon: "fa-map-location-dot",
                isFinale: false
            },
            {
                name: "Public Speaking & Shloka Singing",
                date: "14-Nov-2026, 2.30pm onwards",
                organizer: "Vijayan Sir / Padma Venkat Madam",
                icon: "fa-microphone",
                isFinale: false
            },
            {
                name: "Rangoli",
                date: "15-Nov-2026, 11am onwards",
                organizer: "Padma Venkat madam",
                icon: "fa-palette",
                isFinale: false
            },
            {
                name: "1 Min Games",
                date: "TBD",
                organizer: "TBD",
                icon: "fa-stopwatch",
                isFinale: false
            },
            {
                name: "Badminton",
                date: "21-Nov-2026",
                organizer: "Vignesh",
                icon: "fa-table-tennis-paddle-ball",
                isFinale: false
            },
            {
                name: "Throwball & Volleyball",
                date: "22-Nov-2026",
                organizer: "Karthik and Manasa",
                icon: "fa-volleyball",
                isFinale: false
            },
            {
                name: "Table Tennis",
                date: "23 to 27-Nov-2026",
                organizer: "Vignesh",
                icon: "fa-ping-pong-paddle",
                isFinale: false
            },
            {
                name: "Snooker",
                date: "28-Nov-2026",
                organizer: "Prasanna",
                icon: "fa-circle-dot",
                isFinale: false
            },
            {
                name: "Cricket and Football",
                date: "29-Nov-2026",
                organizer: "Abish / Harshith / Sanjay / Manasa",
                icon: "fa-futbol",
                isFinale: false
            },
            {
                name: "ASP DAY - Grand Event",
                description: "Performances & Prize Distribution",
                date: "Yet to be decided",
                organizer: "Shruthi / Vijayan Sir / Abish / Amit",
                icon: "fa-trophy",
                isFinale: true
            }
        ];

        const tableBody = document.getElementById("table-body");

        eventsData.forEach((item) => {
            const tr = document.createElement("tr");
            tr.className = item.isFinale 
                ? "bg-amber-50/50 hover:bg-amber-50 transition-colors font-medium"
                : "hover:bg-slate-50 transition-colors";

            tr.innerHTML = `
                <td class="py-4 px-6 font-semibold text-slate-900">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-xl ${item.isFinale ? 'bg-amber-100 text-amber-700' : 'bg-indigo-50 text-indigo-600'} flex items-center justify-center text-sm shrink-0">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <div>
                            <span>${item.name}</span>
                            ${item.description ? `<div class="text-xs font-normal text-amber-800/80 mt-0.5">${item.description}</div>` : ''}
                        </div>
                    </div>
                </td>
                <td class="py-4 px-6 text-slate-700 font-medium whitespace-nowrap">
                    ${item.date === 'Yet to be decided' 
                        ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">
                             <i class="fa-regular fa-clock"></i> ${item.date}
                           </span>` 
                        : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                             <i class="fa-regular fa-calendar-days text-indigo-500"></i> ${item.date}
                           </span>`
                    }
                </td>
                <td class="py-4 px-6 text-slate-700">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-user-tie text-slate-400 text-xs"></i>
                        <span class="font-medium text-slate-800">${item.organizer}</span>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    </script>
</body>
</html>
